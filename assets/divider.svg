<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 30" width="600" height="30">
  <line x1="0" y1="15" x2="600" y2="15" stroke="#6D28D9" stroke-width="0.5" opacity="0.3"/>
  <circle cx="300" cy="15" r="4" fill="#C084FC">
    <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="300" cy="15" r="8" fill="none" stroke="#C084FC" stroke-width="0.5" opacity="0.5">
    <animate attributeName="r" values="6;12;6" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0;0.5" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
