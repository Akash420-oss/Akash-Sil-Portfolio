<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <filter id="sunGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="planetGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="starGlow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFBE6"/>
      <stop offset="40%" stop-color="#FFD9A0"/>
      <stop offset="100%" stop-color="#FF9E3D"/>
    </radialGradient>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#120825"/>
      <stop offset="100%" stop-color="#050210"/>
    </radialGradient>
  </defs>

  <!-- Deep space background -->
  <rect width="800" height="400" fill="url(#bgGrad)"/>

  <!-- Twinkling stars -->
  <circle cx="50" cy="30" r="1" fill="#fff" filter="url(#starGlow)"><animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/></circle>
  <circle cx="150" cy="80" r="0.8" fill="#C4B5FD"><animate attributeName="opacity" values="1;0.2;1" dur="4s" repeatCount="indefinite"/></circle>
  <circle cx="700" cy="50" r="1.2" fill="#fff" filter="url(#starGlow)"><animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite"/></circle>
  <circle cx="620" cy="120" r="0.6" fill="#A78BFA"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="5s" repeatCount="indefinite"/></circle>
  <circle cx="750" cy="350" r="1" fill="#fff"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.5s" repeatCount="indefinite"/></circle>
  <circle cx="100" cy="350" r="0.8" fill="#C4B5FD"><animate attributeName="opacity" values="1;0.3;1" dur="4.5s" repeatCount="indefinite"/></circle>
  <circle cx="300" cy="20" r="0.7" fill="#fff"><animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/></circle>
  <circle cx="500" cy="380" r="0.9" fill="#A78BFA"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="3s" repeatCount="indefinite"/></circle>
  <circle cx="680" cy="280" r="0.5" fill="#fff"><animate attributeName="opacity" values="1;0.4;1" dur="6s" repeatCount="indefinite"/></circle>
  <circle cx="250" cy="370" r="1.1" fill="#fff" filter="url(#starGlow)"><animate attributeName="opacity" values="0.2;1;0.2" dur="4s" repeatCount="indefinite"/></circle>
  <circle cx="420" cy="45" r="0.6" fill="#C4B5FD"><animate attributeName="opacity" values="0.7;0.1;0.7" dur="5.5s" repeatCount="indefinite"/></circle>
  <circle cx="80" cy="200" r="0.9" fill="#fff"><animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/></circle>
  <circle cx="770" cy="180" r="0.7" fill="#A78BFA"><animate attributeName="opacity" values="0.9;0.3;0.9" dur="2.8s" repeatCount="indefinite"/></circle>
  <circle cx="350" cy="310" r="0.5" fill="#fff"><animate attributeName="opacity" values="0.4;1;0.4" dur="4.2s" repeatCount="indefinite"/></circle>
  <circle cx="560" cy="60" r="1" fill="#fff" filter="url(#starGlow)"><animate attributeName="opacity" values="0.6;1;0.6" dur="3.3s" repeatCount="indefinite"/></circle>

  <!-- Orbit rings -->
  <ellipse cx="400" cy="200" rx="70" ry="35" fill="none" stroke="#C084FC" stroke-width="0.4" opacity="0.3" stroke-dasharray="4 3"/>
  <ellipse cx="400" cy="200" rx="110" ry="55" fill="none" stroke="#7C6BFF" stroke-width="0.4" opacity="0.25" stroke-dasharray="5 4"/>
  <ellipse cx="400" cy="200" rx="145" ry="72" fill="none" stroke="#A855F7" stroke-width="0.4" opacity="0.2" stroke-dasharray="4 3"/>
  <ellipse cx="400" cy="200" rx="175" ry="88" fill="none" stroke="#ACE5EE" stroke-width="0.4" opacity="0.18" stroke-dasharray="5 4"/>
  <ellipse cx="400" cy="200" rx="210" ry="105" fill="none" stroke="#FFBC75" stroke-width="0.3" opacity="0.15" stroke-dasharray="4 3"/>
  <ellipse cx="400" cy="200" rx="250" ry="125" fill="none" stroke="#6D28D9" stroke-width="0.3" opacity="0.12" stroke-dasharray="5 4"/>
  <ellipse cx="400" cy="200" rx="290" ry="145" fill="none" stroke="#D8B4FE" stroke-width="0.3" opacity="0.1" stroke-dasharray="4 3"/>
  <ellipse cx="400" cy="200" rx="340" ry="170" fill="none" stroke="#8B5CF6" stroke-width="0.3" opacity="0.08" stroke-dasharray="5 4"/>

  <!-- Sun (Core Terminal) -->
  <circle cx="400" cy="200" r="22" fill="url(#sunGrad)" filter="url(#sunGlow)">
    <animate attributeName="r" values="22;25;22" dur="4s" repeatCount="indefinite"/>
  </circle>
  <text x="400" y="205" text-anchor="middle" fill="#0A0416" font-family="monospace" font-size="10" font-weight="bold">CORE</text>

  <!-- Planet 1: Monalisa ONI -->
  <circle r="8" fill="#C084FC" filter="url(#planetGlow)">
    <animateMotion dur="12s" repeatCount="indefinite" path="M470,200 A70,35 0 1,1 330,200 A70,35 0 1,1 470,200"/>
  </circle>
  <circle r="2" fill="#E9D5FF">
    <animateMotion dur="12s" repeatCount="indefinite" path="M482,195 A82,40 0 1,1 318,195 A82,40 0 1,1 482,195"/>
  </circle>

  <!-- Planet 2: Malvoid (with rings) -->
  <g>
    <animateMotion dur="20s" repeatCount="indefinite" path="M510,200 A110,55 0 1,1 290,200 A110,55 0 1,1 510,200"/>
    <ellipse cx="0" cy="0" rx="14" ry="4" fill="none" stroke="#9D8AFF" stroke-width="1.5" opacity="0.6" transform="rotate(-20)"/>
    <circle r="9" fill="#7C6BFF" filter="url(#planetGlow)"/>
  </g>

  <!-- Planet 3: Daredevil -->
  <circle r="7.5" fill="#A855F7" filter="url(#planetGlow)">
    <animateMotion dur="16s" repeatCount="indefinite" path="M545,200 A145,72 0 1,1 255,200 A145,72 0 1,1 545,200"/>
  </circle>

  <!-- Planet 4: Project Monalisa -->
  <circle r="7" fill="#ACE5EE" filter="url(#planetGlow)">
    <animateMotion dur="24s" repeatCount="indefinite" path="M575,200 A175,88 0 1,1 225,200 A175,88 0 1,1 575,200"/>
  </circle>

  <!-- Planet 5: Daredevil Web -->
  <circle r="7.5" fill="#FFBC75" filter="url(#planetGlow)">
    <animateMotion dur="30s" repeatCount="indefinite" path="M610,200 A210,105 0 1,1 190,200 A210,105 0 1,1 610,200"/>
  </circle>

  <!-- Planet 6: Drive Connect -->
  <circle r="6.5" fill="#6D28D9" filter="url(#planetGlow)">
    <animateMotion dur="36s" repeatCount="indefinite" path="M650,200 A250,125 0 1,1 150,200 A250,125 0 1,1 650,200"/>
  </circle>

  <!-- Planet 7: LoVeriA ViRus -->
  <circle r="5.5" fill="#D8B4FE" filter="url(#planetGlow)">
    <animateMotion dur="42s" repeatCount="indefinite" path="M690,200 A290,145 0 1,1 110,200 A290,145 0 1,1 690,200"/>
  </circle>

  <!-- Planet 8: Community -->
  <circle r="5" fill="#8B5CF6" filter="url(#planetGlow)">
    <animateMotion dur="50s" repeatCount="indefinite" path="M740,200 A340,170 0 1,1 60,200 A340,170 0 1,1 740,200"/>
  </circle>

  <!-- Asteroids (cyber threats) -->
  <g opacity="0.7">
    <polygon points="0,-3 2,-1 3,2 -1,3 -3,0" fill="#FF6B6B">
      <animateMotion dur="8s" repeatCount="indefinite" path="M800,50 L0,350"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="8s" repeatCount="indefinite"/>
    </polygon>
  </g>
  <g opacity="0.6">
    <polygon points="0,-2 1.5,0 2,2 -1,2 -2,-1" fill="#FFA07A">
      <animateMotion dur="11s" repeatCount="indefinite" path="M0,100 L800,300"/>
      <animate attributeName="opacity" values="0;0.6;0" dur="11s" repeatCount="indefinite"/>
    </polygon>
  </g>
  <g opacity="0.5">
    <polygon points="0,-2.5 2,0 1,2.5 -2,1" fill="#FF4444">
      <animateMotion dur="14s" repeatCount="indefinite" path="M750,0 L50,400"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="14s" repeatCount="indefinite"/>
    </polygon>
  </g>

  <!-- Rocket -->
  <g filter="url(#planetGlow)">
    <animateMotion dur="18s" repeatCount="indefinite" path="M100,350 Q200,100 400,150 T700,50 Q600,300 400,250 T100,350" rotate="auto"/>
    <polygon points="0,-8 3,4 0,2 -3,4" fill="#39FF88"/>
    <circle cx="0" cy="6" r="2" fill="#FFD700" opacity="0.8">
      <animate attributeName="r" values="2;4;2" dur="0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="0.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" fill="#E9D5FF" font-family="monospace" font-size="16" font-weight="bold" letter-spacing="4">
    AKASH SIL'S UNIVERSE
    <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
  </text>
  <text x="400" y="48" text-anchor="middle" fill="#A78BFA" font-family="monospace" font-size="9" letter-spacing="2">
    CYBERSECURITY RESEARCHER · SECURITY SOFTWARE ENGINEER
  </text>
</svg>
